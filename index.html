<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股個股趨勢與加權指數新高分析</title>
    <!-- 引入 Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; margin: 20px; background-color: #f8f9fa; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { margin-top: 0; color: #1a252f; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        input { padding: 10px 14px; font-size: 15px; border: 1px solid #ced4da; border-radius: 6px; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #007bff; }
        input[type="password"] { flex: 2; min-width: 250px; }
        input[type="text"] { flex: 1; min-width: 150px; }
        button { padding: 10px 20px; font-size: 15px; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background-color 0.2s; }
        button:hover { background-color: #0056b3; }
        .chart-container { position: relative; height: 60vh; width: 100%; margin-top: 10px; }
        #status-msg { margin-bottom: 15px; font-size: 14px; padding: 10px; border-radius: 6px; display: none; }
        .status-loading { background-color: #e2e3e5; color: #383d41; }
        .status-error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="container">
    <h2>台股個股趨勢與大盤新高分析</h2>
    <div class="input-group">
        <input type="password" id="tokenInput" placeholder="請貼上您的 FinMind Token">
        <input type="text" id="stockIdInput" placeholder="股票代號 (如: 2330)" value="2330">
        <button onclick="fetchDataAndDraw()">查詢並繪圖</button>
    </div>
    
    <div id="status-msg"></div>

    <div class="chart-container">
        <canvas id="stockChart"></canvas>
    </div>
</div>

<script>
let myChart = null;

function showStatus(text, type) {
    const statusDiv = document.getElementById('status-msg');
    statusDiv.style.display = 'block';
    statusDiv.innerText = text;
    statusDiv.className = type === 'error' ? 'status-error' : 'status-loading';
}

function hideStatus() {
    document.getElementById('status-msg').style.display = 'none';
}

// 計算 MA 均線
function calculateMA(data, dayCount) {
    let result = [];
    for (let i = 0; i < data.length; i++) {
        if (i < dayCount - 1) {
            result.push(null);
            continue;
        }
        let sum = 0;
        for (let j = 0; j < dayCount; j++) {
            sum += data[i - j];
        }
        result.push(Number((sum / dayCount).toFixed(2)));
    }
    return result;
}

async function fetchDataAndDraw() {
    const token = document.getElementById('tokenInput').value.trim();
    const stockId = document.getElementById('stockIdInput').value.trim();

    if (!token || !stockId) {
        alert('請輸入 FinMind Token 與股票代號！');
        return;
    }

    showStatus('數據獲取中，請稍候...', 'loading');

    // 設定搜尋區間（預設一年）
    const endDate = new Date().toISOString().split('T')[0];
    const startDateObj = new Date();
    startDateObj.setFullYear(startDateObj.getFullYear() - 1);
    const startDate = startDateObj.toISOString().split('T')[0];

    try {
        // 1. 抓取個股資料 (TaiwanStockPrice)
        const stockUrl = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=${stockId}&start_date=${startDate}&end_date=${endDate}&token=${token}`;
        const stockRes = await fetch(stockUrl);
        const stockJson = await stockRes.json();

        if (stockJson.status !== 200 || !stockJson.data || stockJson.data.length === 0) {
            throw new Error(`個股資料抓取失敗：${stockJson.msg || '查無此股票代號或 Token 無效'}`);
        }

        // 2. 抓取大盤加權指數資料 (TaiwanStockPrice, data_id=TAIEX)
        const taiexUrl = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=TAIEX&start_date=${startDate}&end_date=${endDate}&token=${token}`;
        const taiexRes = await fetch(taiexUrl);
        const taiexJson = await taiexRes.json();

        // 整理個股數據
        const dates = stockJson.data.map(d => d.date);
        const closePrices = stockJson.data.map(d => d.close);
        const volumes = stockJson.data.map(d => Math.round((d.Trading_Volume || 0) / 1000)); // 換算成張數

        // 計算均線
        const ma5 = calculateMA(closePrices, 5);
        const ma20 = calculateMA(closePrices, 20);
        const ma60 = calculateMA(closePrices, 60);

        // 計算大盤當期歷史創新高的日期集合
        const taiexHighDates = new Set();
        if (taiexJson.data && taiexJson.data.length > 0) {
            let maxTaiex = -Infinity;
            taiexJson.data.forEach(d => {
                const price = d.close;
                if (price > maxTaiex) {
                    maxTaiex = price;
                    taiexHighDates.add(d.date); // 記錄創新高當天
                }
            });
        }

        // 大盤創新高的點標記圓圈 (點半徑 6px)，其餘為 0
        const pointRadiusArr = dates.map(date => taiexHighDates.has(date) ? 6 : 0);
        const pointHoverRadiusArr = dates.map(date => taiexHighDates.has(date) ? 8 : 3);

        hideStatus();
        renderChart(dates, closePrices, volumes, ma5, ma20, ma60, pointRadiusArr, pointHoverRadiusArr);

    } catch (error) {
        console.error(error);
        showStatus(error.message, 'error');
    }
}

function renderChart(labels, closePrices, volumes, ma5, ma20, ma60, pointRadius, pointHoverRadius) {
    const ctx = document.getElementById('stockChart').getContext('2d');

    if (myChart) {
        myChart.destroy();
    }

    myChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [
                {
                    type: 'line',
                    label: '收盤價 (Y1)',
                    data: closePrices,
                    borderColor: '#dc3545',
                    borderWidth: 2,
                    fill: false,
                    yAxisID: 'y1',
                    pointRadius: pointRadius,
                    pointBackgroundColor: '#ffc107',
                    pointBorderColor: '#dc3545',
                    pointBorderWidth: 2,
                    pointHoverRadius: pointHoverRadius
                },
                {
                    type: 'line',
                    label: '5日均線 (MA5)',
                    data: ma5,
                    borderColor: '#0d6efd',
                    borderWidth: 1.5,
                    pointRadius: 0,
                    fill: false,
                    yAxisID: 'y1'
                },
                {
                    type: 'line',
                    label: '20日均線 (MA20)',
                    data: ma20,
                    borderColor: '#198754',
                    borderWidth: 1.5,
                    pointRadius: 0,
                    fill: false,
                    yAxisID: 'y1'
                },
                {
                    type: 'line',
                    label: '60日均線 (MA60)',
                    data: ma60,
                    borderColor: '#6f42c1',
                    borderWidth: 1.5,
                    pointRadius: 0,
                    fill: false,
                    yAxisID: 'y1'
                },
                {
                    type: 'bar',
                    label: '成交量/張 (Y2)',
                    data: volumes,
                    backgroundColor: 'rgba(108, 117, 125, 0.3)',
                    yAxisID: 'y2'
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            scales: {
                x: { title: { display: true, text: '日期' } },
                y1: {
                    type: 'linear',
                    display: true,
                    position: 'left',
                    title: { display: true, text: '股價 (TWD)' }
                },
                y2: {
                    type: 'linear',
                    display: true,
                    position: 'right',
                    grid: { drawOnChartArea: false },
                    title: { display: true, text: '成交量 (張)' }
                }
            },
            plugins: {
                tooltip: {
                    callbacks: {
                        afterBody: function(context) {
                            const index = context[0].dataIndex;
                            if (pointRadius[index] > 0) {
                                return '\n★ 當日加權指數創歷史新高！';
                            }
                            return '';
                        }
                    }
                }
            }
        }
    });
}
</script>

</body>
</html>
